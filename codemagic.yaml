# Codemagic baut die iOS-App auf einem Cloud-Mac und lädt sie zu TestFlight.
#
# Code Signing (gemäß Codemagic-Support):
#  - KEIN ios_signing-Block (das war der Weg, der scheiterte)
#  - Stattdessen erzeugt fetch-signing-files mit CERTIFICATE_PRIVATE_KEY
#    automatisch Zertifikat + Provisioning-Profil bei Apple (--create).
#
# Voraussetzungen in Codemagic (einmalig):
#  1. App Store Connect / Developer Portal Integration, Reference Name: CodemagicAppStore
#  2. Environment-Variable CERTIFICATE_PRIVATE_KEY (Gruppe: code-signing)
#     mit dem RSA-Schlüssel (-----BEGIN RSA PRIVATE KEY----- ... -----END...-----)

workflows:
  ios-eli:
    name: ELI iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: CodemagicAppStore
    environment:
      groups:
        - code-signing
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "de.elena.eli"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: NPM-Pakete installieren
        script: npm install
      - name: iOS-Plattform hinzufügen
        script: npx cap add ios || true
      - name: Web-Assets synchronisieren
        script: npx cap sync ios
      - name: App-Icons generieren (falls assets/ vorhanden)
        script: |
          npx capacitor-assets generate --ios || echo "assets-Schritt uebersprungen"
      - name: Code Signing einrichten (Zertifikat + Profil erstellen)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "de.elena.eli" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: IPA bauen
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
